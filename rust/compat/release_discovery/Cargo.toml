[package]
name = "jmcl-release-discovery-probe"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
async-trait = "=0.1.91"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.0", features = ["process", "io-util", "sync", "rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Threading"] }
