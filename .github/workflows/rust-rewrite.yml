name: Experimental Rust rewrite compatibility

on:
  pull_request:
  push:
    branches: [main, rust-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-rewrite-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: 1.99.1
  # Experimental exact allowlist only; strict replacement checks omit this.
  JMCL_ALLOW_KNOWN_ORACLE_GAPS: "1"
  JMCL_ALLOW_PROCESSOR_HASH_LIFETIME_GAP: "1"
  JMCL_ALLOW_ZIG007_READONLY_RENAME: "1"
  JMCL_ALLOW_ZIG008_LOADER_PATHS: "1"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  ORACLE_REVISION: 5a4310debbcee26b3d2391bab2339f79cd6ec52e

jobs:
  native:
    # Standard public runners only; no secrets, releases or uploaded artifacts.
    if: github.event.repository.visibility == 'public'
    name: Experimental Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 678mjoe/JMCLCore
          ref: ${{ env.ORACLE_REVISION }}
          path: .ci-oracle
          persist-credentials: false
      - name: Install pinned Rust through official rustup
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_VERSION"
      - name: Install checksum-pinned official Zig 0.16.0
        run: |
          python - <<'PYTHON'
          #!/usr/bin/env python3
          """Install the pinned official Zig archive in RUNNER_TEMP, never system-wide.

          SHA-256 values: https://ziglang.org/download/index.json (0.16.0).
          Only the four explicitly supported native CI host architectures are accepted.
          """
          import hashlib
          import os
          from pathlib import Path
          import platform
          import shutil
          import subprocess
          import tempfile
          import urllib.request
          import zipfile

          VERSION = "0.16.0"
          ARCHIVES = {
              ("Linux", "x86_64"): ("x86_64-linux", "tar.xz", "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"),
              ("Darwin", "x86_64"): ("x86_64-macos", "tar.xz", "0387557ed1877bc6a2e1802c8391953baddba76081876301c522f52977b52ba7"),
              ("Darwin", "arm64"): ("aarch64-macos", "tar.xz", "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"),
              ("Windows", "AMD64"): ("x86_64-windows", "zip", "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"),
          }


          def main():
              target, extension, digest = ARCHIVES[(platform.system(), platform.machine())]
              name = f"zig-{target}-{VERSION}"
              root = Path(tempfile.mkdtemp(prefix="jmcl-zig-", dir=os.environ["RUNNER_TEMP"]))
              archive = root / f"{name}.{extension}"
              url = f"https://ziglang.org/download/{VERSION}/{archive.name}"
              with urllib.request.urlopen(url, timeout=120) as response, archive.open("wb") as output:
                  shutil.copyfileobj(response, output)
              if hashlib.sha256(archive.read_bytes()).hexdigest() != digest:
                  raise RuntimeError("Official Zig archive SHA-256 mismatch; refusing to extract or execute")
              if extension == "zip":
                  with zipfile.ZipFile(archive) as compressed:
                      compressed.extractall(root)
              else:
                  subprocess.run(["tar", "-xJf", str(archive), "-C", str(root)], check=True)
              binary = root / name / ("zig.exe" if platform.system() == "Windows" else "zig")
              actual = subprocess.check_output([str(binary), "version"], text=True).strip()
              if actual != VERSION:
                  raise RuntimeError(f"Unexpected Zig version: {actual}")
              with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as output:
                  output.write(str(binary.parent) + "\n")
              print(f"Verified Zig {actual} for {target}: sha256={digest}")


          if __name__ == "__main__":
              main()
          PYTHON
      - name: Build pinned Zig oracle (not an implementation dependency)
        run: |
          test "$(git -C .ci-oracle rev-parse HEAD)" = "$ORACLE_REVISION"
          (cd .ci-oracle && zig build -Doptimize=ReleaseSafe --summary all)
          python - <<'PYTHON'
          import os
          from pathlib import Path
          binary = Path(".ci-oracle/zig-out/bin") / ("jmcl-core.exe" if os.name == "nt" else "jmcl-core")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"JMCL_ZIG_ORACLE={binary.resolve()}\n")
              output.write(f"JMCL_ZIG_SOURCE={Path('.ci-oracle').resolve()}\n")
          PYTHON
      - name: Build pinned domain differential adapters
        run: |
          python - <<'PYTHON'
          import os, subprocess
          from pathlib import Path
          names = {
              "metadata": "JMCL_ZIG_METADATA_ORACLE",
              "loaders": "JMCL_ZIG_LOADERS_ORACLE",
              "content_metadata": "JMCL_CONTENT_METADATA_ORACLE",
              "install": "JMCL_ZIG_INSTALL_ORACLE",
              "prepare": "JMCL_ZIG_PREPARE_ORACLE",
              "modpack": "JMCL_MODPACK_ORACLE",
              "launch": "JMCL_ZIG_LAUNCH_ORACLE",
              "launch_process": "JMCL_ZIG_LAUNCH_PROCESS_ORACLE",
          }
          suffix = ".exe" if os.name == "nt" else ""
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name, variable in names.items():
                  binary = Path(os.environ["RUNNER_TEMP"]) / f"jmcl-{name}-oracle{suffix}"
                  subprocess.run(["zig", "build-exe", "--dep", "jmcl_core",
                                  f"-Mroot=rust/compat/{name}_oracle.zig",
                                  f"-Mjmcl_core={Path('.ci-oracle/src/root.zig').resolve()}",
                                  f"-femit-bin={binary}"], check=True)
                  output.write(f"{variable}={binary}\n")
              binary = Path(os.environ["RUNNER_TEMP"]) / f"jmcl-loaders-install-oracle{suffix}"
              subprocess.run(["zig", "build-exe", "--dep", "jmcl_core", "--dep", "jmcl_cli",
                              "-Mroot=rust/compat/loaders_install_oracle.zig",
                              f"-Mjmcl_core={Path('.ci-oracle/src/root.zig').resolve()}",
                              "--dep", "jmcl_core", f"-Mjmcl_cli={Path('.ci-oracle/src/main.zig').resolve()}",
                              f"-femit-bin={binary}"], check=True)
              output.write(f"JMCL_ZIG_LOADERS_INSTALL_ORACLE={binary}\n")
              if os.name != "nt":
                  child = Path(os.environ["RUNNER_TEMP"]) / "jmcl-launch-child"
                  subprocess.run(["cc", "rust/tests/fixtures/launch/child.c", "-o", str(child)], check=True)
                  output.write(f"JMCL_FAKE_LAUNCH_CHILD={child}\n")
          PYTHON
      - name: Build explicitly injected service oracles (synthetic transports only)
        run: |
          python - <<'PYTHON'
          import os, shutil, subprocess, sys
          from pathlib import Path
          zig = shutil.which("zig")
          root = Path(os.environ["RUNNER_TEMP"])
          jobs = [
              ("JMCL_AUTH_ORACLE", [sys.executable, "rust/compat/build_auth_oracle.py", zig, ".ci-oracle", str(root / "jmcl-auth-oracle")]),
              ("JMCL_CONTENT_SERVICE_ORACLE", [sys.executable, "rust/compat/build_content_fixture_oracle.py", "--source", ".ci-oracle", "--output", str(root / "jmcl-content-oracle"), "--zig", zig]),
              ("JMCL_CONTENT_FILENAME_ORACLE", [sys.executable, "rust/compat/build_content_fixture_oracle.py", "--source", ".ci-oracle", "--output", str(root / "jmcl-content-filename-oracle"), "--zig", zig, "--deny-artifact-fetch"]),
          ]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for variable, command in jobs:
                  binary = subprocess.check_output(command, text=True).strip().splitlines()[-1]
                  assert Path(binary).is_file(), binary
                  output.write(f"{variable}={binary}\n")
          PYTHON
      - name: Rust formatting and tests
        working-directory: rust
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then export JMCL_REQUIRE_CROSS_DEVICE=1; fi
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets -- --include-ignored --show-output --skip gc_rechecks_stale_preflight_after_owned_transaction
          cargo test --locked --test store_differential -- --include-ignored --nocapture
          cargo build --locked --release
      - name: Pure existing-candidate proof boundary guard
        run: |
          python rust/compat/check_existing_candidate_proof.py
          python rust/compat/test_existing_candidate_proof_guard.py
          python -O rust/compat/test_existing_candidate_proof_guard.py
      - name: Differential implemented-slice compatibility
        run: |
          python rust/compat/test_validate_coverage.py
          python -O rust/compat/test_validate_coverage.py
          python rust/compat/validate_coverage.py --oracle-source .ci-oracle
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            python rust/compat/check.py --zig .ci-oracle/zig-out/bin/jmcl-core.exe --rust rust/target/release/jmcl-core-rust.exe --oracle-source .ci-oracle --allow-approved-deviations
            python rust/compat/accounts.py --zig .ci-oracle/zig-out/bin/jmcl-core.exe --rust rust/target/release/jmcl-core-rust.exe
          else
            python rust/compat/check.py --zig .ci-oracle/zig-out/bin/jmcl-core --rust rust/target/release/jmcl-core-rust --oracle-source .ci-oracle --allow-approved-deviations
            python rust/compat/accounts.py --zig .ci-oracle/zig-out/bin/jmcl-core --rust rust/target/release/jmcl-core-rust
          fi
      - name: Local content project selector byte compatibility
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/content_project_selectors.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Account byte-string disk and parameter boundaries
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          for script in ["account_disk_bytes.py", "account_param_bytes.py"]:
              subprocess.run([sys.executable, f"rust/compat/{script}",
                              "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                              "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                              "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Read-only manifest diagnostics and typed source enums
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          for script in ["server_show_errors.py", "manifest_source_enum.py", "instance_id_errors.py", "manifest_display_names.py", "lookup_id_bytes.py", "server_list_params.py", "lookup_directory_bytes.py", "server_delete_read.py", "server_root_open.py"]:
              subprocess.run([sys.executable, f"rust/compat/{script}",
                              "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                              "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                              "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Listing-only persisted receipt byte compatibility
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/receipt_byte_list.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Client list native-directory byte compatibility
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/content_list_directory_bytes.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Server list native target byte compatibility
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/server_content_list_target_bytes.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Server list display-name read-view compatibility
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/server_content_list_display_bytes.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Client local mutation directory-byte compatibility
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/content_mutation_directory_bytes.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Local content ignored-field parsing compatibility
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/content_local_field_parser.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Read-only datapack world-byte compatibility
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/datapack_list_world_bytes.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Guarded datapack mutation world-byte compatibility
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/datapack_mutation_world_bytes.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Adoption target contracts with explicit per-engine CAS layout
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/content_adopt_target_bytes.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: No-state server local target compatibility
        if: runner.os == 'Linux'
        run: |
          python rust/compat/server_local_target_bytes.py --zig .ci-oracle/zig-out/bin/jmcl-core --rust rust/target/release/jmcl-core-rust --oracle-source .ci-oracle
      - name: No-state server local display-name compatibility
        if: runner.os == 'Linux'
        run: |
          python rust/compat/server_local_display_bytes.py --zig .ci-oracle/zig-out/bin/jmcl-core --rust rust/target/release/jmcl-core-rust --oracle-source .ci-oracle
      - name: No-state server local CLI display-name compatibility
        if: runner.os == 'Linux'
        run: |
          python rust/compat/server_cli_display_bytes.py --zig .ci-oracle/zig-out/bin/jmcl-core --rust rust/target/release/jmcl-core-rust --oracle-source .ci-oracle
      - name: No-state server adoption byte targets and explicit CAS contract
        if: runner.os == 'Linux'
        run: |
          python rust/compat/server_adopt_target_bytes.py --zig .ci-oracle/zig-out/bin/jmcl-core --rust rust/target/release/jmcl-core-rust --oracle-source .ci-oracle
      - name: No-state server adoption display-name validation
        if: runner.os == 'Linux'
        run: |
          python rust/compat/server_adopt_display_bytes.py --zig .ci-oracle/zig-out/bin/jmcl-core --rust rust/target/release/jmcl-core-rust --oracle-source .ci-oracle
      - name: Native instance content CLI path contracts
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/content_cli_native_paths.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Local content CLI manifest display-name contracts
        run: |
          python - <<'PYTHON'
          import os, subprocess, sys
          suffix = ".exe" if os.name == "nt" else ""
          subprocess.run([sys.executable, "rust/compat/content_cli_manifest_names.py",
                          "--zig", f".ci-oracle/zig-out/bin/jmcl-core{suffix}",
                          "--rust", f"rust/target/release/jmcl-core-rust{suffix}",
                          "--oracle-source", ".ci-oracle"], check=True)
          PYTHON
      - name: Bounded owned CAS GC stale-preflight verification
        run: |
          python - <<'PYTHON'
          import json, subprocess, sys
          result = subprocess.run(["cargo", "test", "--manifest-path", "rust/Cargo.toml",
                                   "--locked", "--lib", "--no-run", "--message-format=json"],
                                  check=True, text=True, stdout=subprocess.PIPE)
          artifacts = []
          for line in result.stdout.splitlines():
              row = json.loads(line)
              if (row.get("reason") == "compiler-artifact" and row.get("profile", {}).get("test")
                  and row.get("target", {}).get("kind") == ["lib"] and row.get("executable")):
                  artifacts.append(row["executable"])
          if len(artifacts) != 1:
              raise SystemExit(f"Expected one owned library test artifact, found {artifacts!r}")
          subprocess.run([sys.executable, "rust/compat/cas_gc_recheck.py",
                          "--test-binary", artifacts[0]], check=True)
          PYTHON
      - name: Offline metadata and Java raw-wire corpus
        run: |
          python - <<'PYTHON'
          import os, subprocess
          suffix = ".exe" if os.name == "nt" else ""
          failures = []
          for script in ["version_check.py", "java.py", "launch_rpc.py", "launch_execute.py", "instance_install.py", "instance_validation_check.py", "protocol_edges.py", "store.py"]:
              result = subprocess.run(["python", f"rust/compat/{script}", "--zig",
                                       f".ci-oracle/zig-out/bin/jmcl-core{suffix}", "--rust",
                                       f"rust/target/release/jmcl-core-rust{suffix}"], check=False)
              if result.returncode != 0:
                  failures.append((script, result.returncode))
          if failures:
              raise SystemExit(f"Offline corpus failures: {failures}")
          PYTHON
      - name: World export and backup CLI archive corpus
        run: |
          python - <<'PYTHON'
          import hashlib, os, subprocess, sys
          from pathlib import Path
          suffix = ".exe" if os.name == "nt" else ""
          zig = Path(f".ci-oracle/zig-out/bin/jmcl-core{suffix}")
          rust = Path(f"rust/target/release/jmcl-core-rust{suffix}")
          subprocess.run([sys.executable, "rust/compat/world_cli_archives.py",
                          "--zig", str(zig), "--zig-sha256", hashlib.sha256(zig.read_bytes()).hexdigest(),
                          "--rust", str(rust), "--rust-sha256", hashlib.sha256(rust.read_bytes()).hexdigest()], check=True)
          PYTHON
      - name: Pinned Linux server lifecycle and worldset matrix
        if: runner.os == 'Linux'
        run: |
          python rust/compat/server_oracle.py --zig .ci-oracle/zig-out/bin/jmcl-core --rust rust/target/release/jmcl-core-rust --oracle-source .ci-oracle
          python rust/compat/server_remote.py --zig .ci-oracle/zig-out/bin/jmcl-core --rust rust/target/release/jmcl-core-rust --oracle-source .ci-oracle
          python rust/compat/server_install.py --zig .ci-oracle/zig-out/bin/jmcl-core --rust rust/target/release/jmcl-core-rust --oracle-source .ci-oracle
