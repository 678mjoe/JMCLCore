name: Bounded current frontend Rust bridge

on:
  pull_request:
  push:
    branches: [rust-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-frontend-bridge-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_REVISION: 91ec19d8125942296054d076013a7ae538f64c5d
  ORACLE_REVISION: 5a4310debbcee26b3d2391bab2339f79cd6ec52e
  RUST_VERSION: 1.99.1
  BUN_VERSION: 1.4.4
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  bridge:
    if: github.event.repository.visibility == 'public'
    name: Synthetic frontend bridge (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 678mjoe/JMCL-frontend
          ref: ${{ env.FRONTEND_REVISION }}
          path: .ci-frontend
          persist-credentials: false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: 678mjoe/JMCLCore
          ref: ${{ env.ORACLE_REVISION }}
          path: .ci-oracle
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install pinned Rust and checksum-pinned Zig
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          rustup default "$RUST_VERSION"
          python .ci-frontend/scripts/setup-ci-zig.py
      - name: Build the experimental binary and unchanged pinned oracle
        run: |
          test "$(git -C .ci-oracle rev-parse HEAD)" = "$ORACLE_REVISION"
          test "$(git -C .ci-frontend rev-parse HEAD)" = "$FRONTEND_REVISION"
          (cd .ci-oracle && zig build -Doptimize=ReleaseSafe)
          cargo build --locked --manifest-path rust/Cargo.toml
          (cd .ci-frontend && bun install --frozen-lockfile)
      - name: Check test-source formatting and Python syntax
        run: |
          rustfmt --edition 2021 --check rust/compat/frontend_bridge/tests/bridge.rs
          python -m py_compile rust/compat/frontend_bridge/run.py
      - name: Real executables with synthetic local fixtures (not Tauri IPC or UI)
        run: |
          suffix=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then suffix=".exe"; fi
          export CARGO_TARGET_DIR="$RUNNER_TEMP/jmcl-frontend-bridge-target"
          python rust/compat/frontend_bridge/run.py \
            --frontend .ci-frontend \
            --rust "rust/target/debug/jmcl-core-rust${suffix}" \
            --zig ".ci-oracle/zig-out/bin/jmcl-core${suffix}"
      # No package, artifact upload, credential access, real service, game or SSH.
      # The shipping frontend workflow and its Zig pin are untouched.
