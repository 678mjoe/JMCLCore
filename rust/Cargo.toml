[package]
name = "jmcl-core-rust"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "LGPL-3.0-or-later"
publish = false

[lib]
name = "jmcl_core_rust"

[[bin]]
name = "jmcl-core-rust"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value", "preserve_order"] }
zeroize = "1.9"
sha1 = "0.10"
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "rustls"] }
flate2 = "=1.1.9"
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
base64 = "=0.22.1"
time = { version = "=0.3.54", default-features = false, features = ["std"] }
getrandom = "=0.4.3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }
