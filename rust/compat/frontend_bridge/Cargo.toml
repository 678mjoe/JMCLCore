[package]
name = "jmcl-frontend-bridge-check"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "jmcl_lib"

[dependencies]
async-trait = "=0.1.91"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.0", features = ["process", "io-util", "sync", "rt", "time", "macros"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2"] }
tempfile = "=3.27.0"
base64 = { version = "=0.22.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_Threading"] }

[features]
# Local explicit opt-in only; no existing workflow enables this feature.
local-native-instance-chain = []
local-native-content-lifecycle = []
local-native-launch-chain = ["dep:base64"]

[[test]]
name = "instance_chain"
required-features = ["local-native-instance-chain"]

[[test]]
name = "content_lifecycle"
required-features = ["local-native-content-lifecycle"]

[[test]]
name = "launch_chain"
required-features = ["local-native-launch-chain"]
